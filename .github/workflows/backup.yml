name: Nightly D1 backup

# Posts live in D1, not git, so this is the content's safety net on top of
# D1 Time Travel (30-day point-in-time restore on Workers Paid). Dumps are
# written to the private jetsfix-backups bucket (provisioned by hand);
# give it a lifecycle rule (e.g. delete after 365 days) in the dashboard.
#
# Uses its own narrow token, CLOUDFLARE_BACKUP_TOKEN: read the jetsfix D1
# database, write objects to jetsfix-backups. It can't deploy anything.
on:
  schedule:
    - cron: "17 7 * * *" # 03:17 ET-ish, after the overnight lull
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Export D1 and upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y-%m-%dT%H%MZ)
          npx wrangler d1 export jetsfix --remote --output "jetsfix-$stamp.sql"
          gzip -9 "jetsfix-$stamp.sql"
          ls -lh "jetsfix-$stamp.sql.gz"
          npx wrangler r2 object put "jetsfix-backups/d1/jetsfix-$stamp.sql.gz" \
            --file "jetsfix-$stamp.sql.gz" --remote
