name: Nightly backup

# Posts live in D1, not git. D1 Time Travel already gives a 30-day
# point-in-time restore inside Cloudflare; this keeps a portable copy as well.
#
# It uses EmDash's site export (content, revision history, settings, media)
# through the site's API, not `wrangler d1 export`, because a D1 export
# makes the database unavailable while it runs — and GitHub starts scheduled
# jobs hours late, so that would land in the morning traffic.
#
# Restore into an empty site with `npx emdash site import <file> --url ...`
# (README "Backups"). The package holds author and commenter emails: it goes
# only to the private jetsfix-backups bucket, never to an Actions artifact
# (this repo is public).
#
# Secrets (production environment):
#   EMDASH_BACKUP_TOKEN      EmDash API token with export scope
#   R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY
#                            R2 API token (S3 credentials), Object Read &
#                            Write on the jetsfix-backups bucket only
#   CLOUDFLARE_ACCOUNT_ID    for the R2 S3 endpoint
# Variable: SITE_URL — the site to back up.
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Export site
        env:
          EMDASH_TOKEN: ${{ secrets.EMDASH_BACKUP_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail
          [ -n "$EMDASH_TOKEN" ] && [ -n "$SITE_URL" ] || { echo "::error::EMDASH_BACKUP_TOKEN or SITE_URL not set"; exit 1; }
          echo "STAMP=$(date -u +%Y-%m-%dT%H%MZ)" >> "$GITHUB_ENV"
          # Re-running the same command resumes an interrupted export.
          for attempt in 1 2 3; do
            if npx emdash site export --url "$SITE_URL" --output site.emdash; then exit 0; fi
            echo "export attempt $attempt failed; resuming"; sleep 30
          done
          exit 1
      # S3-compatible upload: bucket-scoped R2 credentials work here, while
      # `wrangler r2 object put` needs a broader Cloudflare API token.
      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 doesn't accept the CLI's default extra checksums on uploads.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ls -lh site.emdash
          aws s3 cp site.emdash "s3://jetsfix-backups/site/jetsfix-$STAMP.emdash" \
            --endpoint-url "https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --no-progress
